name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install headless browser
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver fonts-liberation

      - name: Clean virtualenv install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Syntax check
        run: |
          . .venv/bin/activate
          python -m compileall -q .

      - name: Unit + local-lab integration tests
        run: |
          . .venv/bin/activate
          mkdir -p reports
          python -m pytest tests/ -q \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            2>&1 | tee reports/pytest-${{ matrix.python-version }}.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
